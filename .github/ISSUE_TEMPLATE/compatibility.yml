name: Compatibility issue
description: The bicycle addon breaks or misbehaves together with another addon, gamemode or player model.
title: "[Compatibility] "
labels: [ "compatibility" ]
body:
- type: markdown
  attributes:
    value: |
      Use this template when the problem **only** happens while another addon is installed. Please check that first:
      disable the other addon and confirm the problem goes away.

- type: input
  id: addon-name
  attributes:
    label: Incompatible addon
    description: Name of the addon, gamemode or player model that causes the problem.
    placeholder: Example Player Animations Pack
  validations:
    required: true

- type: input
  id: addon-link
  attributes:
    label: Link to the addon
    description: Steam Workshop, GitHub or other download page.
    placeholder: https://steamcommunity.com/sharedfiles/filedetails/?id=...
  validations:
    required: true

- type: textarea
  id: what-happened
  attributes:
    label: What goes wrong?
    description: Describe what happens with both addons installed, and what should happen instead.
    placeholder: While riding, the rider's legs point backwards instead of reaching the pedals.
  validations:
    required: true

- type: textarea
  id: steps
  attributes:
    label: Steps to reproduce
    placeholder: |
      1. Subscribe to both addons
      2. Pick the player model ...
      3. Ride the bicycle
  validations:
    required: true

- type: textarea
  id: errors
  attributes:
    label: Console errors
    description: |
      Copy every Lua error from the console (open it with `~`), including the full stack trace.
    render: text

- type: textarea
  id: screenshots
  attributes:
    label: Screenshots or video
    description: Show the problem in game. Drag images or videos into this box, or paste a link.
  validations:
    required: true

- type: dropdown
  id: bike
  attributes:
    label: Which bike?
    description: If it's a custom bike, name it and link to it in the description above.
    multiple: true
    options:
    - Built-in default bike
    - Custom bike model
    - All bikes

- type: dropdown
  id: session
  attributes:
    label: Where does it happen?
    multiple: true
    options:
    - Singleplayer
    - Multiplayer (listen server / hosting from the menu)
    - Multiplayer (dedicated server)
  validations:
    required: true

- type: checkboxes
  id: checks
  attributes:
    label: Checklist
    options:
    - label: I disabled the other addon and the problem went away.
      required: true
    - label: I searched the existing issues and this hasn't been reported yet.
      required: true
